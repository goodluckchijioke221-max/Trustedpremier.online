<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trustedpremier Online Bank - Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7f8;
      color: #17252a;
    }

    header {
      background: #073b4c;
      color: white;
      padding: 18px 6%;
      text-align: center;
      font-size: 21px;
      font-weight: bold;
    }

    header span {
      color: #8bd3dd;
    }

    .notice {
      background: #fff3cd;
      color: #664d03;
      padding: 12px;
      text-align: center;
      font-size: 13px;
    }

    .container {
      max-width: 430px;
      margin: 50px auto;
      padding: 0 20px;
    }

    .box {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 25px rgba(0,0,0,.08);
    }

    h1 {
      margin-top: 0;
      text-align: center;
    }

    p {
      color: #60727a;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 7px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccd7da;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #073b4c;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #073b4c;
      text-decoration: none;
    }
  </style>
</head>

<body>

<header>
  Trustedpremier <span>Online Bank</span>
</header>

<div class="notice">
  Simulation platform — no real funds and no real banking services.
</div>

<div class="container">

  <div class="box">

    <h1>Welcome back</h1>

    <p>
      Sign in to your simulated banking account.
    </p>

    <form id="loginForm">

      <label for="email">Email address</label>

      <input
        id="email"
        type="email"
        placeholder="you@example.com"
        required
      >

      <label for="password">Password</label>

      <input
        id="password"
        type="password"
        placeholder="Enter your password"
        required
      >

      <button type="submit">
        Log in
      </button>

    </form>

    <a href="index.html" class="back">
      ← Back to homepage
    </a>

  </div>

</div>

<script>
  document.getElementById("loginForm").addEventListener("submit", function(event) {
    event.preventDefault();

    alert("Login connection will be added in the next step.");
  });
</script>

</body>
</html>
